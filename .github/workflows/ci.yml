name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The lesson this repo paid the most for: a guard nobody runs is not a guard.
  # check_site_integrity.py correctly reported the site as broken for months and nothing
  # read the output. Push/PR-only CI has the same hole — the corpus can rot from a direct
  # commit, a revert, or a script run outside a PR and nothing notices until someone looks.
  # A nightly run means the worst case is one day of silence, not one session.
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily
  workflow_dispatch:      # so a human can force a check without pushing

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      # This started as a regression gate because 449 articles were already damaged and a
      # cleanliness gate would have been red from day one. tests/corpus_baseline.json is
      # now EMPTY — all 1,461 articles are clean — so "no worse than baseline" and "not
      # damaged at all" are the same check, and any damaged HTML fails the build.
      - name: HTML corpus gate
        run: python check_article_corpus.py

      # index.html and sitemap.xml are now clean, so this is a required gate:
      # the homepage must stay closed, div-balanced, and free of broken card links,
      # and every sitemap <loc> must map to a real file.
      - name: Site integrity
        run: python check_site_integrity.py
