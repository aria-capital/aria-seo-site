title: Money Psychology
description: Building passive income stream by stream. Real numbers, no fluff.
url: https://aria-capital.github.io
baseurl: /aria-seo-site
theme: minima

# Keep source, docs and tests out of the published site. NEVER add a "*.txt" glob
# here: ads.txt and robots.txt must keep serving (AdSense authorization + crawling).
# NEVER add .nojekyll either — underscore-prefixed files rely on Jekyll's exclusion.
exclude:
  - "*.py"
  - "*.bat"
  - CLAUDE.md
  - pytest.ini
  - requirements-dev.txt
  - new_articles_batch1.txt
  - new_articles_batch2.txt
  - new_articles_batch3.txt
  - new_articles_buyer_intent.txt
  - tests
  # NEVER exclude a bare filename that is a PREFIX of another file. GitHub Pages builds with
  # Jekyll 3.10, whose exclude filter matches by string prefix as well as by glob, so an entry
  # `feed` would also drop feeding-intolerance-gastric-residuals-icu-nurses-2026.html — a live,
  # sitemap-advertised article. Found in review on 2026-09-02, before it shipped. Files that
  # must stop being served go under an underscore directory instead (Jekyll skips those by
  # default): the two dead "Midnight Brief" RSS feeds now live in _unpublished_feeds/.
